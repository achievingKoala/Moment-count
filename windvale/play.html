<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>风栖村 · 随处走走</title><link rel="stylesheet" href="./style.css"><header><small>A LITTLE PLACE TO WANDER</small><h1>风栖村</h1><p>把时间交给小路和风。</p></header><div class="tools"><button id="home">回到村口</button><button id="music-toggle" type="button" aria-pressed="true">♫ 音乐：开</button><button id="light">☀ 午后</button></div><div id="notice"></div><button id="quest-toggle" type="button" aria-expanded="false" aria-controls="quest-panel" hidden>任务</button><aside id="quest-panel" aria-label="任务与金币" hidden><strong id="quest-heading"></strong><p id="quest-objective" role="status"></p><p id="quest-reward">奖励：10 枚金币</p><div id="quest-wallet">金币：<span id="coin-count">0</span></div></aside><div class="cross"></div><div class="bottom">W A S D / 方向键 · 跑步　 移动鼠标 · 环顾<span>SHIFT 加速跑 · E 交谈 · 手机点击交谈按钮</span></div><div class="pad"><button data-key="KeyW" aria-label="向前">↑</button><button data-key="KeyA" aria-label="向左">←</button><button data-key="KeyS" aria-label="向后">↓</button><button data-key="KeyD" aria-label="向右">→</button></div><button id="talk" hidden>交谈</button><section id="dialog" aria-label="村民对话" aria-live="polite" hidden><strong id="npc-name"></strong><div id="practice-label" hidden>IELTS Speaking · Part 1 · 休闲时间</div><p id="dialog-text" lang="en"></p><button id="hint-toggle" type="button" aria-expanded="false" aria-controls="answer-hint" hidden>查看英文思路</button><p id="answer-hint" lang="en" hidden style="font-size:13px;line-height:1.7;color:#4b6659;background:#edf3ed;padding:10px 12px;border-radius:8px"></p><button id="feedback-toggle" type="button" hidden aria-expanded="false" aria-controls="ai-feedback">查看反馈记录</button><section style="background:#f7faf6;border:1px solid #d3dfd3;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 4px 14px #243b3510;overflow-wrap:anywhere" id="ai-feedback" aria-label="AI 文字反馈" hidden><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px"><button type="button" id="feedback-previous" aria-label="上一条反馈">←</button><span id="feedback-counter" aria-live="polite"></span><button type="button" id="feedback-next" aria-label="下一条反馈">→</button></div><div id="ai-feedback-status" role="status"></div><div id="ai-feedback-content"></div></section><form id="answer-form" hidden><label for="practice-answer">用英文写下你的回答</label><textarea id="practice-answer" lang="en" placeholder="In my free time, I like to…" maxlength="3000"></textarea><button type="submit">提交回答并获取反馈</button><div id="answer-status" role="status"></div></form><div id="voice-status" role="status"></div><button id="dialog-next">继续 · E</button><button id="dialog-repeat">再听一遍</button><button id="dialog-close">结束 · Esc</button></section><div class="welcome" id="welcome"><div class="card"><small>WELCOME TO WINDVALE</small><h2>去村里走走</h2><p>沿着石子路，经过红屋顶的小房子，<br>带着小小旅人，在树荫和风车间慢慢走。</p><button id="start">开始漫步 →</button><p style="font-size:10px;margin-bottom:0">本地运行 · 随时停留</p></div></div><script type="module" src="./app.js"></script></html>
