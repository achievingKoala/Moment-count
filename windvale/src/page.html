</style><header><small>A LITTLE PLACE TO WANDER</small><h1>风栖村</h1><p>把时间交给小路和风。</p></header><div class="tools"><button id="home">回到村口</button><button id="light">☀ 午后</button></div><div id="notice"></div><div class="cross"></div><div class="bottom">W A S D / 方向键 · 行走　 移动鼠标 · 环顾<span>SHIFT 快走 · E 交谈 · 手机点击交谈按钮</span></div><div class="pad"><button data-key="KeyW" aria-label="向前">↑</button><button data-key="KeyA" aria-label="向左">←</button><button data-key="KeyS" aria-label="向后">↓</button><button data-key="KeyD" aria-label="向右">→</button></div><button id="talk" hidden>交谈</button><section id="dialog" aria-label="村民对话" aria-live="polite" hidden><strong id="npc-name"></strong><p id="dialog-text"></p><div id="voice-status" role="status"></div><button id="dialog-next">继续 · E</button><button id="dialog-repeat">再听一遍</button><button id="dialog-close">结束 · Esc</button></section><div class="welcome" id="welcome"><div class="card"><small>WELCOME TO WINDVALE</small><h2>去村里走走</h2><p>沿着石子路，经过红屋顶的小房子，<br>带着小小旅人，在树荫和风车间慢慢走。</p><button id="start">开始漫步 →</button><p style="font-size:10px;margin-bottom:0">本地运行 · 没有任务 · 随时停留</p></div></div><script type="module" src="./app.js"></script></html>
